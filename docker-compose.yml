services:
  anselmotech-social:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0      # exige APP_PASSWORD no .env
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"   # exponha via proxy reverso com HTTPS (ex.: o mesmo do n8n)
    volumes:
      - ./data:/app/data       # rascunhos, fila de publicação e histórico persistem aqui
